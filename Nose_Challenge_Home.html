    <style>
        * {
            box-sizing: border-box;
            margin: 0;

        }
        body {
            background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0d061a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 25px;
            max-width: 380px;
            width: 100%;

        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }

        h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #fff;
        }
        p {
            color: #b0b0d0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 0;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.6);
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #ff5500;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
