<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>සුබ ලෝක ළමා දිනයක් වේවා! | Children's Day Greetings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; scroll-behavior: smooth; }

body {
  background: linear-gradient(180deg, #090d16 0%, #111827 50%, #090d16 100%);
  color: #f8fafc;
  font-family: 'Noto Sans Sinhala', Arial, sans-serif;
}

.wrap { max-width: 420px; margin: 0 auto; position: relative; z-index: 10; }

.main-icon { font-size: 52px; margin-bottom: 12px; display: inline-block; animation: glow 1.8s ease-in-out infinite alternate; }
@keyframes glow { 
  from { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; transform: scale(1); } 
  to { text-shadow: 0 0 25px #ff5500, 0 0 40px #ff5500; transform: scale(1.05); } 
}

.falling-item {
  position: fixed;
  top: -10%;
  color: #ff2a5f;
  font-size: 20px;
  opacity: 0.35;
  z-index: 1;
  pointer-events: none;
  animation-name: fall, sway;
  animation-timing-function: linear, ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes fall { 0% { top: -10%; } 100% { top: 110%; } }
@keyframes sway { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(40px) rotate(180deg); } 100% { transform: translateX(0) rotate(360deg); } }  
  
.full-card {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}
.card {
  background: linear-gradient(145deg, rgba(17, 24, 39, 0.9), rgba(15, 15, 26, 0.95)); 
  background-size: cover;
  background-position: center;
  border: 1px solid rgba(255, 42, 95, 0.4);
  border-radius: 20px;
  padding: 32px 24px 24px 24px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(255, 0, 85, 0.25);
  width: 100%;
  position: relative;
  color: #fff;
  backdrop-filter: blur(10px);
}

h1 { 
  font-size: 26px; 
  color: #fff; 
  margin-bottom: 16px; 
  font-weight: 900; 
  letter-spacing: 0.8px;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ff0055, #ff5500, #ff0055);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.wish-text {
  font-size: 17px;
  line-height: 1.8;
  color: #f1f5f9;
  background: rgba(255, 255, 255, 0.05); 
  padding: 20px;
  border-radius: 14px;
  margin: 16px 0;
  min-height: 105px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  font-weight: 700;
}
.from { font-size: 16px; color: #ff5500; margin-bottom: 25px; font-weight: bold;}
  
.btn {
  width: 100%;
  background: linear-gradient(90deg, #ff0055, #ff5500);
  color: #fff;
  border: none;
  border-radius: 24px;
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
}
.btn:active { transform: scale(0.98); }

.scroll-hint {
  position: relative;
  font-size: 13px;
  color: #94a3b8;
  animation: bounce 2s infinite;
  text-align: center;
  margin: 15px auto 0 auto;
  font-weight: 700;
  display: block;
  width: 100%;
}
@keyframes bounce {
 0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
 40% { transform: translateY(-6px); }
 60% { transform: translateY(-3px); }
}

.maker-section {
  min-height: 100vh;
  padding: 40px 20px;
  display: flex;
  align-items: center;
  position: relative;
  z-index: 10;
}
.maker-card {
  background: #111827;
  border: 1px solid rgba(255, 0, 85, 0.3);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
  width: 100%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.maker-title { font-size: 20px; color: #ff0055; margin-bottom: 20px; font-weight: bold; }
.input-group { margin-bottom: 15px; }
.input-wrap { position: relative; }
input {
  width: 100%;
  background: #090d16;
  border: 1px solid rgba(255, 0, 85, 0.4);
  border-radius: 12px;
  padding: 14px 45px 14px 14px;
  color: #f8fafc;
  font-size: 15px;
  font-family: 'Noto Sans Sinhala', sans-serif;
  outline: none;
}
input:focus { border-color: #ff0055; background: #131b2e; }

.ai-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: linear-gradient(135deg, #ff0055, #ff5500);
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.ai-btn svg { width: 18px; height: 18px; fill: #fff; }
</style>
</head>
<body>

<div id="fallingContainer"></div>

<div class="wrap">
  <!-- 1. Review Card Section (Shared Wish View) -->
  <section class="full-card" id="section1">
    <div class="card">
      <div class="main-icon">🔥👑</div>
      <h1>ලෝක ළමා දිනය</h1>
      <div class="wish-text" id="wishText">...</div>
      <div class="from" id="fromText">...</div>

      <div class="scroll-hint">
        ඔබේ සුබපැතුම සාදා යවන්න ⬇
      </div>
    </div>
  </section>

  <!-- 2. Form Section (New Wish Maker) -->
  <section class="maker-section" id="section2">
    <div class="maker-card">
      <div class="maker-title">🖊️ ඔබේ සුබපැතුම හදන්න</div>
      <form id="wishForm" onsubmit="redirectToAd(event)">
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="ඔබේ නම" maxlength="50" required>
        </div>
        <div class="input-wrap">
          <input type="text" id="msgInput" placeholder="සුබපැතුම් පණිවිඩය" maxlength="90" required>
          <button type="button" class="ai-btn" onclick="generateWish()" title="වෙනස් පණිවිඩයක්">
            <svg viewBox="0 0 24 24">
              <path d="M12,2L15.09,8.26L22,9.27L17,14.14L18.18,21.02L12,17.77L5.82,21.02L7,14.14L2,9.27L8.91,8.26L12,2Z"/>
            </svg>
          </button>
        </div>
        <br>
        <button type="submit" class="btn">Whatsapp හරහා යවන්න</button>
      </form>
    </div>
  </section>
</div>

<script>
const defaultMsg = "තමන්ගේ ගමන තනියම හදාගෙන ලෝකය දිනන්න යන අපේ කොල්ලන්ට කෙල්ලන්ට සුබ ළමා දිනයක්! 🔥";
const defaultFrom = "ඔබේ හිතවතෙක්";

const boldWishes = [
  "තමන්ගේ ගමන තනියම හදාගෙන ලෝකය දිනන්න යන අපේ කොල්ලන්ට කෙල්ලන්ට සුබ ළමා දිනයක්! 🔥",
  "කවුරු මොනවා කිව්වත් උඹේ හීන පස්සේ පලයං. අනාගතය උඹේ අතේ! 🚀⚡",
  "කිසිම අභියෝගයක් ඉදිරියේ නතර වෙන්න එපා. උඹට පුළුවන් මේ ලෝකෙම වෙනස් කරන්න! 👑🎯",
  "දැනුමෙන්, දක්ෂතාවයෙන් සහ ගේම් එකෙන් ඉහළටම යන්න සුබ පැතුම්! 🏆🔥",
  "තමන්ගේ අනන්‍යතාවය රැකගෙන කෙලින් හිටගන්න. සුබ ලෝක ළමා දිනයක්! ⚡💎",
  "අද වපුරන කැපකිරීම්වල ප්‍රතිඵල හෙට උඹට ලැබෙනවාමයි. Never give up! 🎯✨",
  "තමන් ගැන විශ්වාසය තියන් උඩටම යන්න. සුබම සුබ ළමා දිනයක් වේවා! 🚀🔥",
  "ලෝකයට උඹ කවුද කියලා පෙන්වන්න වෙලාව හරි. Go big or go home! 👑💥",
  "හැමදාමත් නිර්මාණශීලීව, ස්වාධීනව හිතලා ගේම් එක වෙනස් කරන්න! ⚡💡",
  "අනාගතයේ විශාලම සලකුණ තබන සියලුම අයට සුබ ළමා දිනයක්! 🏆🚀"
];
let wishIndex = 0;

function getParams() {
  const params = new URLSearchParams(window.location.search);
  let msg = params.get('msg');
  let from = params.get('from') || params.get('fromName');
  const dParam = params.get('d');

  if (dParam) {
    try {
      const jsonString = decodeURIComponent(atob(dParam).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      const decoded = JSON.parse(jsonString);
      if (decoded.m) msg = decoded.m;
      if (decoded.f) from = decoded.f;
    } catch(e) {
      console.error("Payload parse error", e);
    }
  }

  return { 
    msg: msg || defaultMsg, 
    from: from || defaultFrom 
  };
}

function loadCard() {
  const {msg, from} = getParams();
  document.getElementById('wishText').textContent = msg;
  document.getElementById('fromText').textContent = "- " + from;
  createFallingItems(); 
}

function createFallingItems() {
  const container = document.getElementById('fallingContainer');
  const items = ['🔥', '⚡', '👑', '🚀', '🎯', '💎', '✨'];
  const itemCount = 20;
  for (let i = 0; i < itemCount; i++) {
    const item = document.createElement('div');
    item.classList.add('falling-item');
    item.textContent = items[Math.floor(Math.random() * items.length)];
    item.style.left = Math.random() * 100 + 'vw';
    item.style.fontSize = Math.random() * 10 + 16 + 'px';
    item.style.animationDuration = Math.random() * 5 + 7 + 's';
    item.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(item);
  }
}

function generateWish() {
  const msgInput = document.getElementById('msgInput');
  msgInput.value = boldWishes[wishIndex];
  wishIndex = (wishIndex + 1) % boldWishes.length;
  msgInput.focus();
}

function redirectToAd(event) {
  event.preventDefault(); 
  
  const BLOGGER_URL = "https://noypolo.blogspot.com"; 
  
  const name = document.getElementById('nameInput').value.trim() || defaultFrom;
  const msg = document.getElementById('msgInput').value.trim() || defaultMsg;
  
  // UTF-8 Safe Base64 Encoding for Sinhala Text
  const payloadObj = { m: msg, f: name };
  const jsonStr = JSON.stringify(payloadObj);
  const encodedD = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g, function(match, p1) {
    return String.fromCharCode('0x' + p1);
  }));

  const bloggerShareTarget = `${BLOGGER_URL}?from=w&p=Children_Day.html&action=share&d=${encodedD}`;
  
  window.location.href = bloggerShareTarget;
}

window.onload = loadCard;
</script>
</body>
</html>
